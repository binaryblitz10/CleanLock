name: CleanLock
options:
  bundleIdPrefix: com.cleanlock
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    PRODUCT_NAME: CleanLock
    INFOPLIST_KEY_LSUIElement: YES
    INFOPLIST_KEY_NSHumanReadableCopyright: ""
    INFOPLIST_KEY_CFBundleDisplayName: CleanLock
targets:
  CleanLock:
    type: application
    platform: macOS
    sources:
      - path: CleanLock
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
      - path: CleanLock/Assets.xcassets
    info:
      path: CleanLock/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        NSHumanReadableCopyright: ""
        LSMinimumSystemVersion: "15.0"
        CFBundleIconFile: "AppIcon"
    entitlements:
      path: CleanLock/CleanLock.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanlock.app
        CODE_SIGN_ENTITLEMENTS: CleanLock/CleanLock.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    dependencies:
      - sdk: Carbon.framework
      - sdk: AppKit.framework
      - sdk: ApplicationServices.framework
      - sdk: IOKit.framework
